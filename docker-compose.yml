services:
  scala:
    build:
      context: ./scala
    image: gamestats-scala:latest
    container_name: gamestats-scala
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  go:
    build:
      context: ./go
    image: gamestats-go:latest
    container_name: gamestats-go
    environment:
      HTTP_ADDR: ":8081"
      SCALA_URL: "http://scala:8080"
      FLUSH_GRACE: "2s"
      IDLE_TIMEOUT: "30s"
      RETENTION: "10m"
      VALIDATORS: "4"
      SCALA_WORKERS: "4"
      INVALID_KEEP: "1000"
    ports:
      - "8081:8081"
    depends_on:
      scala:
        condition: service_healthy
    restart: unless-stopped
