name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-go:
    name: Go Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verificar formato y estática
        run: go vet ./...

      - name: Ejecutar pruebas unitarias y detector de carreras
        run: go test -v -race ./...

      - name: Compilar binario de Go
        run: CGO_ENABLED=0 go build -v ./cmd/gamestats

  test-scala:
    name: Scala Tests & Assembly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar SBT
        uses: sbt/setup-sbt@v1

      - name: Ejecutar pruebas y compilar jar
        run: sbt test assembly

  build-containers:
    name: Build Docker Containers
    needs: [test-go, test-scala]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker de Go
        run: docker build -t gamestats-go:latest ./go

      - name: Build imagen Docker de Scala
        run: docker build -t gamestats-scala:latest ./scala
