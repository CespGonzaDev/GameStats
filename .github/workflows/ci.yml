name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-go:
    name: Go Lint, Tests & Race Detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verificar formato y estática
        run: go vet ./...

      - name: Ejecutar pruebas unitarias y detector de carreras
        run: go test -v -race ./...

      - name: Compilar binario de Go
        run: CGO_ENABLED=0 go build -v ./cmd/gamestats

  build-containers:
    name: Build & Smoke Test Docker
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker de Go
        run: docker build -t gamestats-go:latest ./go
